<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="utf-8">
  <title>Danmaku Enhancer Settings</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <h2 data-i18n="appName"></h2>

    <div class="setting-group">
      <label class="select-row">
        <span data-i18n="popup.language"></span>
        <!-- Each language is named in itself, so the labels are not translated. -->
        <select id="uiLanguage">
          <option value="zh-TW">繁體中文</option>
          <option value="en">English</option>
        </select>
      </label>
      <p class="desc" data-i18n="popup.languageDesc"></p>
    </div>

    <div class="setting-group">
      <label>
        <input type="checkbox" id="overlayToggle">
        <span data-i18n="popup.overlay"></span>
      </label>
      <p class="desc" data-i18n="popup.overlayDesc"></p>
    </div>

    <div class="setting-group">
      <label>
        <input type="checkbox" id="liveToggle">
        <span data-i18n="popup.live"></span>
      </label>
      <p class="desc" data-i18n="popup.liveDesc"></p>
    </div>

    <div class="setting-group">
      <label>
        <input type="checkbox" id="densityToggle">
        <span data-i18n="popup.density"></span>
      </label>
      <p class="desc" data-i18n="popup.densityDesc"></p>
    </div>

    <div class="setting-group">
      <label>
        <input type="checkbox" id="aiFilterToggle">
        <span data-i18n="popup.ai"></span>
      </label>
      <p class="desc" data-i18n="popup.aiDesc"></p>
    </div>

    <div class="setting-group">
      <h3><span data-i18n="popup.bookmarks"></span> <span id="bookmarkCount" class="count"></span></h3>
      <p class="hint" data-i18n-html="popup.bookmarksHint"></p>
      <button id="openBookmarks" class="full-width" data-i18n="popup.openManager"></button>
    </div>

    <div class="setting-group">
      <h3 data-i18n="popup.keywords"></h3>
      <div class="input-group">
        <input type="text" id="newKeyword" data-i18n-placeholder="popup.keywordPlaceholder">
        <button id="addKeyword" data-i18n="add"></button>
      </div>
      <ul id="keywordList" class="block-list"></ul>
    </div>

    <div class="setting-group">
      <h3 data-i18n="popup.users"></h3>
      <div class="input-group">
        <input type="text" id="newUser" data-i18n-placeholder="popup.userPlaceholder">
        <button id="addUser" data-i18n="add"></button>
      </div>
      <ul id="userList" class="block-list"></ul>
    </div>

    <div class="setting-group">
      <h3><span data-i18n="popup.debugLog"></span> <span id="debugCount" class="count"></span></h3>
      <div class="input-group">
        <button id="exportLog" data-i18n="export"></button>
        <button id="clearLog" data-i18n="clear"></button>
      </div>
    </div>
  </div>
  <script src="../i18n.js"></script>
  <script src="popup.js"></script>
</body>
</html>
