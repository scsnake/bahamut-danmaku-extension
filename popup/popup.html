<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="utf-8">
  <title>Danmaku Enhancer Settings</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <h2 data-i18n="appName"></h2>

    <div class="setting-group">
      <label>
        <input type="checkbox" id="overlayToggle" aria-describedby="tip-overlayToggle">
        <span data-i18n="popup.overlay"></span>
        <button type="button" class="info" aria-describedby="tip-overlayToggle" data-i18n-aria-label="popup.info">i</button>
      </label>
      <p class="tip" id="tip-overlayToggle" role="tooltip" data-i18n="popup.overlayDesc"></p>
    </div>

    <div class="setting-group">
      <label>
        <input type="checkbox" id="liveToggle" aria-describedby="tip-liveToggle">
        <span data-i18n="popup.live"></span>
        <button type="button" class="info" aria-describedby="tip-liveToggle" data-i18n-aria-label="popup.info">i</button>
      </label>
      <p class="tip" id="tip-liveToggle" role="tooltip" data-i18n="popup.liveDesc"></p>
    </div>

    <div class="setting-group">
      <label>
        <input type="checkbox" id="infoModeToggle" aria-describedby="tip-infoModeToggle">
        <span data-i18n="popup.infoMode"></span>
        <button type="button" class="info" aria-describedby="tip-infoModeToggle" data-i18n-aria-label="popup.info">i</button>
      </label>
      <p class="tip" id="tip-infoModeToggle" role="tooltip" data-i18n="popup.infoModeDesc"></p>
    </div>

    <div class="setting-group">
      <label>
        <input type="checkbox" id="densityToggle" aria-describedby="tip-densityToggle">
        <span data-i18n="popup.density"></span>
        <button type="button" class="info" aria-describedby="tip-densityToggle" data-i18n-aria-label="popup.info">i</button>
      </label>
      <p class="tip" id="tip-densityToggle" role="tooltip" data-i18n="popup.densityDesc"></p>
    </div>

    <div class="setting-group">
      <label>
        <input type="checkbox" id="opSkipToggle" aria-describedby="tip-opSkipToggle">
        <span data-i18n="popup.opSkip"></span>
        <button type="button" class="info" aria-describedby="tip-opSkipToggle" data-i18n-aria-label="popup.info">i</button>
      </label>
      <p class="tip" id="tip-opSkipToggle" role="tooltip" data-i18n="popup.opSkipDesc"></p>
      <div id="opReportRow" hidden>
        <p class="memo">
          <button type="button" id="opReport" class="link-btn" data-i18n="popup.opReport"></button>
          <span id="opReportNote" hidden data-i18n="popup.opReportNoPage"></span>
        </p>
      </div>
    </div>

    <div class="setting-group">
      <h3><span data-i18n="popup.bookmarks"></span> <span id="bookmarkCount" class="count"></span></h3>
      <p class="hint" data-i18n-html="popup.bookmarksHint"></p>
      <button id="openBookmarks" class="full-width" data-i18n="popup.openManager"></button>
    </div>

    <div class="setting-group">
      <h3><span data-i18n="popup.search"></span> <button type="button" class="info" aria-describedby="tip-openSearch" data-i18n-aria-label="popup.info">i</button></h3>
      <p class="tip" id="tip-openSearch" role="tooltip" data-i18n="popup.searchDesc"></p>
      <button id="openSearch" aria-describedby="tip-openSearch" class="full-width" data-i18n="popup.openSearch"></button>
    </div>

    <button type="button" id="openOptions" class="full-width secondary" data-i18n="popup.allSettings"></button>
  </div>
  <script src="../i18n.js"></script>
  <script src="../options/settings-ui.js"></script>
  <script src="popup.js"></script>
</body>
</html>
