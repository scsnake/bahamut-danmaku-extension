<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-i18n="mgr.pageTitle">Scene Bookmarks</title>
  <link rel="stylesheet" href="manager.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <svg class="brand-mark" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.2l2.7 5.5 6 .9-4.4 4.2 1 6-5.3-2.8-5.3 2.8 1-6-4.4-4.2 6-.9z"/></svg>
        <div>
          <h1 data-i18n="mgr.pageTitle"></h1>
          <p id="summary" class="summary"></p>
        </div>
      </div>
      <input id="search" class="search" type="search" data-i18n-placeholder="mgr.searchPlaceholder" data-i18n-aria-label="mgr.searchLabel">
      <div class="io">
        <button id="exportBtn" class="btn ghost" type="button" data-i18n="export"></button>
        <button id="importBtn" class="btn ghost" type="button" data-i18n="import"></button>
        <input id="importFile" type="file" accept="application/json,.json" hidden>
      </div>
    </div>
  </header>

  <nav class="filters" data-i18n-aria-label="mgr.filters">
    <div class="segmented" id="kindFilter" role="group" data-i18n-aria-label="mgr.type">
      <button type="button" data-kind="all" class="active" data-i18n="mgr.all"></button>
      <button type="button" data-kind="moment" data-i18n="mgr.kindMoments"></button>
      <button type="button" data-kind="clip" data-i18n="mgr.kindClips"></button>
    </div>
    <select id="workFilter" data-i18n-aria-label="mgr.work">
      <option value="" data-i18n="mgr.allWorks"></option>
    </select>
    <select id="sortMode" data-i18n-aria-label="mgr.sort">
      <option value="work" data-i18n="mgr.groupByWork"></option>
      <option value="newest" data-i18n="mgr.newest"></option>
      <option value="oldest" data-i18n="mgr.oldest"></option>
    </select>
    <div id="tagFilter" class="tag-filter"></div>
  </nav>

  <main id="content"></main>

  <section id="empty" class="state" hidden>
    <svg class="state-mark" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.2l2.7 5.5 6 .9-4.4 4.2 1 6-5.3-2.8-5.3 2.8 1-6-4.4-4.2 6-.9z"/></svg>
    <h2 data-i18n="mgr.emptyTitle"></h2>
    <p data-i18n="mgr.emptyText"></p>
    <ul class="keys">
      <li data-i18n-html="mgr.keyMoment"></li>
      <li data-i18n-html="mgr.keyClip"></li>
      <li data-i18n-html="mgr.keyCancel"></li>
    </ul>
  </section>

  <section id="noResults" class="state" hidden>
    <h2 data-i18n="mgr.noResultsTitle"></h2>
    <p data-i18n="mgr.noResultsText"></p>
    <button id="clearFilters" class="btn" type="button" data-i18n="mgr.clearFilters"></button>
  </section>

  <template id="groupTpl">
    <section class="group">
      <header class="group-head">
        <img class="group-cover" alt="" loading="lazy" referrerpolicy="no-referrer">
        <div>
          <h2 class="group-title"></h2>
          <p class="group-count"></p>
        </div>
      </header>
      <div class="grid"></div>
    </section>
  </template>

  <template id="cardTpl">
    <article class="card">
      <button class="thumb" type="button">
        <img alt="" loading="lazy" referrerpolicy="no-referrer">
        <span class="thumb-fallback" aria-hidden="true"></span>
        <span class="badge"></span>
        <span class="play-hint" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M8 5.5v13l10.5-6.5z"/></svg></span>
      </button>
      <div class="card-body">
        <p class="card-work"></p>
        <p class="card-meta"><span class="card-ep"></span><span class="card-time"></span></p>
        <h3 class="card-title"></h3>
        <p class="card-note"></p>
        <div class="card-tags"></div>
      </div>
      <div class="card-actions">
        <button class="act-play" type="button" data-i18n="play"></button>
        <button class="act-edit" type="button" data-i18n="edit"></button>
        <button class="act-delete" type="button" data-i18n="delete"></button>
      </div>
    </article>
  </template>

  <dialog id="editor">
    <form id="editorForm" novalidate>
      <div class="editor-media">
        <img id="edThumb" alt="" referrerpolicy="no-referrer">
      </div>
      <div class="editor-body">
        <p id="edEpisode" class="editor-episode"></p>
        <div class="editor-times">
          <label class="field">
            <span data-i18n="mgr.start"></span>
            <input id="edStart" inputmode="decimal" placeholder="m:ss" autocomplete="off">
          </label>
          <label class="field">
            <span data-i18n-html="mgr.end"></span>
            <input id="edEnd" inputmode="decimal" placeholder="m:ss" autocomplete="off">
          </label>
        </div>
        <label class="field">
          <span data-i18n="bm.title"></span>
          <input id="edTitle" maxlength="200" autocomplete="off">
        </label>
        <label class="field">
          <span data-i18n="bm.note"></span>
          <textarea id="edNote" rows="3" maxlength="5000"></textarea>
        </label>
        <label class="field">
          <span data-i18n="bm.tags"></span>
          <input id="edTags" data-i18n-placeholder="mgr.tagsPlaceholder" autocomplete="off">
        </label>
        <p id="edError" class="error" role="alert"></p>
        <details id="edDanmakuWrap" class="danmaku">
          <summary><span data-i18n="mgr.danmakuAround"></span> (<span id="edDanmakuCount"></span>)</summary>
          <ul id="edDanmaku"></ul>
        </details>
      </div>
      <footer class="editor-actions">
        <button id="edDelete" class="btn ghost danger" type="button" data-i18n="delete"></button>
        <span class="spacer"></span>
        <button id="edPlay" class="btn ghost" type="button" data-i18n="play"></button>
        <button id="edCancel" class="btn ghost" type="button" data-i18n="cancel"></button>
        <button id="edSave" class="btn primary" type="submit" data-i18n="save"></button>
      </footer>
    </form>
  </dialog>

  <div id="toast" class="toast" role="status" hidden>
    <span id="toastMsg"></span>
    <button id="toastAction" type="button" hidden></button>
  </div>

  <script src="../i18n.js"></script>
  <script src="common.js"></script>
  <script src="manager.js"></script>
</body>
</html>
